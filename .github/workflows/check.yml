name: check

# No pull_request trigger: no repo runs CI on pull requests (checks run locally before a PR); main's push still
# shellchecks what landed.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck vps-deploy.sh
